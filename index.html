/* ═══════════════════ ONLINE MULTI-USER ENGINE ═══════════════════
   All users work at the same time. Every change is detected per record,
   sent alone to the server (Google Apps Script), merged there, and pulled
   by every other open screen within seconds. */
const SERVER_GS="/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n   MODO HR \u2014 ONLINE SERVER (Google Apps Script)  v3.0\n   \u2022 Every change = one row appended to a Google Sheet (instant, consistent)\n   \u2022 Full data snapshot kept in Google Drive, refreshed automatically\n   \u2022 All users work at the same time; changes reach everyone in seconds\n   Setup:  script.google.com \u2192 New project \u2192 paste this file \u2192\n           set KEY \u2192 Deploy \u2192 New deployment \u2192 Web app \u2192\n           Execute as: Me \u00b7 Who has access: Anyone \u2192 Deploy.\n   \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nconst KEY = 'CHANGE-ME';                  // same key typed in MODO HR \u2192 Settings \u2192 Online\nconst FOLDER = 'MODO_HR_ONLINE_DATA';     // Google Drive folder (snapshot + change-log sheet)\nconst SNAP_EVERY = 150;                   // rebuild the snapshot every N changes\nconst CELL = 45000;                       // max characters per sheet cell\nconst ID_FIELDS = { leaves:['leave_id','L',3], payrolls:['payroll_id','P',3], advances:['advance_id','A',3], cl_staff:['cl_id','CL',3],\n  penalties:['penalty_id','PE',3], evaluations:['eval_id','EV',3], contract_renewals:['renewal_id','CR',3], change_of_status:['cos_id','COS',3] };\nconst ARRAYS = ['attendance','leaves','payrolls','advances','cl_staff','penalties','evaluations','contract_renewals','change_of_status','activity_log'];\nconst MAPS = ['employees','departments','monthly_snapshots','custom_users','user_permissions','user_passwords','settings'];\n\nfunction doGet(e){ return handle_(e && e.parameter || {}); }\nfunction doPost(e){ return handle_(JSON.parse(e.postData.contents)); }\nfunction out_(o){ return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }\nfunction P_(){ return PropertiesService.getScriptProperties(); }\nfunction num_(k){ return Number(P_().getProperty(k) || 0); }\nfunction set_(k, v){ P_().setProperty(k, String(v)); }\nfunction cache_(){ return CacheService.getScriptCache(); }\n\n/* \u2500\u2500 Drive: folder + snapshot file (remembered by ID) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\nfunction folder_(){\n  const id = P_().getProperty('folder_id');\n  if (id) { try { return DriveApp.getFolderById(id); } catch(e) {} }\n  const it = DriveApp.getFoldersByName(FOLDER); const f = it.hasNext() ? it.next() : DriveApp.createFolder(FOLDER);\n  set_('folder_id', f.getId()); return f;\n}\nfunction readSnap_(){\n  const id = P_().getProperty('snap_id'); if (!id) return { ver: 0, data: {} };\n  try { const t = DriveApp.getFileById(id).getBlob().getDataAsString(); return t ? JSON.parse(t) : { ver: 0, data: {} }; } catch(e) { return { ver: 0, data: {} }; }\n}\nfunction writeSnap_(snap){\n  const t = JSON.stringify(snap); const id = P_().getProperty('snap_id');\n  if (id) { try { DriveApp.getFileById(id).setContent(t); set_('snap_ver', snap.ver); return; } catch(e) {} }\n  const f = folder_().createFile('snapshot.json', t, 'application/json'); set_('snap_id', f.getId()); set_('snap_ver', snap.ver);\n}\n\n/* \u2500\u2500 Sheet: change log (one row per change batch) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\nfunction sheet_(){\n  let id = P_().getProperty('log_ss'), ss = null;\n  if (id) { try { ss = SpreadsheetApp.openById(id); } catch(e) { ss = null; } }\n  if (!ss) {\n    ss = SpreadsheetApp.create('MODO_HR_ONLINE_LOG'); set_('log_ss', ss.getId());\n    try { DriveApp.getFileById(ss.getId()).moveTo(folder_()); } catch(e) {}\n  }\n  return ss.getSheets()[0];\n}\nfunction appendBatch_(b){\n  const s = JSON.stringify(b.ops), chunks = [];\n  for (let i = 0; i < s.length; i += CELL) chunks.push(s.slice(i, i + CELL));\n  sheet_().appendRow([b.v, b.t, b.client, b.user, chunks.length].concat(chunks));\n}\nfunction rowToBatch_(r){ const n = Number(r[4] || 0); let s = ''; for (let i = 0; i < n; i++) s += r[5 + i]; return { v: Number(r[0]), t: r[1], client: r[2], user: r[3], ops: JSON.parse(s || '[]') }; }\nfunction readBatches_(since){                     // batches with v > since, or null when history is no longer available\n  const v = num_('ver'); if (since >= v) return [];\n  const start = num_('log_start'); if (since + 1 < start) return null;\n  const sh = sheet_(); const first = since + 1 - start + 1, n = v - since;\n  if (first < 1 || first + n - 1 > sh.getLastRow()) return null;\n  const rows = sh.getRange(first, 1, n, Math.max(6, sh.getLastColumn())).getValues();\n  const out = rows.map(rowToBatch_);\n  for (let i = 0; i < out.length; i++) if (out[i].v !== since + 1 + i) return null;   // log being compacted \u2014 client retries\n  return out;\n}\n\n/* \u2500\u2500 tail cache: newest batches in memory for very fast polling \u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\nfunction cacheTail_(b){\n  try { let t = JSON.parse(cache_().get('tail') || '[]'); if (t.length && t[t.length-1].v !== b.v - 1) t = [];\n    t.push(b); let s = JSON.stringify(t); while (s.length > 95000 && t.length) { t.shift(); s = JSON.stringify(t); }\n    if (t.length) cache_().put('tail', s, 21600); else cache_().remove('tail'); } catch(e) {}\n}\nfunction changes_(since){\n  const v = num_('ver'); if (since >= v) return { ver: v, batches: [] };\n  try { const t = JSON.parse(cache_().get('tail') || '[]');\n    if (t.length && t[0].v <= since + 1 && t[t.length-1].v === v) return { ver: v, batches: t.filter(function(b){ return b.v > since; }) }; } catch(e) {}\n  const b = readBatches_(since);\n  if (b === null) return { ver: v, reset: true };\n  return { ver: v, batches: b };\n}\n\n/* \u2500\u2500 presence \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\nfunction presence_(p){\n  const c = cache_(); let m = {}; try { m = JSON.parse(c.get('presence') || '{}'); } catch(e) {}\n  const now = Date.now();\n  if (p && p.client && p.user) m[p.client] = { user: p.user, page: p.page || '', t: now };\n  Object.keys(m).forEach(function(k){ if (now - m[k].t > 45000) delete m[k]; });\n  try { c.put('presence', JSON.stringify(m), 300); } catch(e) {}\n  return Object.keys(m).map(function(k){ return { client: k, user: m[k].user, page: m[k].page, ago: Math.round((now - m[k].t)/1000) }; });\n}\n\n/* \u2500\u2500 apply ops to a data object (used for snapshots) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\nfunction applyTo_(d, ops){\n  const idx = {};\n  ops.forEach(function(o){\n    if (o.c === '_root'){ if (o.v === null) delete d[o.k]; else d[o.k] = o.v; return; }\n    if (ARRAYS.indexOf(o.c) >= 0){\n      const a = d[o.c] || (d[o.c] = []);\n      if (!idx[o.c]) { idx[o.c] = {}; a.forEach(function(r, i){ if (r && r._k) idx[o.c][r._k] = i; }); }\n      const at = idx[o.c][o.k];\n      if (o.v === null){ if (at !== undefined){ a[at] = null; delete idx[o.c][o.k]; } }\n      else if (at === undefined){ idx[o.c][o.k] = a.length; a.push(o.v); } else a[at] = o.v;\n    } else { const m = d[o.c] || (d[o.c] = {}); if (o.v === null) delete m[o.k]; else m[o.k] = o.v; }\n  });\n  ARRAYS.forEach(function(c){ if (d[c]) d[c] = d[c].filter(Boolean); });\n  if (d.activity_log && d.activity_log.length > 8000) d.activity_log = d.activity_log.slice(-8000);\n  return d;\n}\nfunction compact_(){                               // snapshot = old snapshot + all newer changes\n  const snap = readSnap_(); if (snap.ver !== num_('snap_ver')) return;   // Drive copy not fresh yet \u2014 try next time\n  const b = readBatches_(snap.ver); if (b === null) return;\n  b.forEach(function(x){ applyTo_(snap.data, x.ops); });\n  const oldVer = snap.ver; snap.ver = num_('ver'); writeSnap_(snap);\n  const start = num_('log_start'), cut = oldVer - start + 1;            // keep rows newer than the previous snapshot\n  if (cut > 0) { try { sheet_().deleteRows(1, cut); set_('log_start', start + cut); } catch(e) {} }\n}\n\n/* \u2500\u2500 number clashes (two users adding at the same moment) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\nfunction fixIds_(ops){\n  const idmap = [];\n  ops.forEach(function(o){\n    const idf = ID_FIELDS[o.c]; if (!idf || !o.v || o.v === null) return;\n    const id = String(o.v[idf[0]] || ''); const P = idf[1].toUpperCase(); if (id.toUpperCase().indexOf(P) !== 0) return;\n    const n = id.slice(P.length); if (!/^\\d+$/.test(n)) return;\n    const key = 'max_' + o.c, mx = num_(key); let use = +n;\n    if (o.n && use <= mx){ use = mx + 1; let s = String(use); while (s.length < idf[2]) s = '0' + s; const nid = idf[1] + s;\n      idmap.push({ c: o.c, k: o.k, field: idf[0], from: id, to: nid }); o.v[idf[0]] = nid; }\n    if (use > mx) set_(key, use);\n  });\n  return idmap;\n}\nfunction initMaxIds_(d){\n  Object.keys(ID_FIELDS).forEach(function(c){ const idf = ID_FIELDS[c], P = idf[1].toUpperCase(); let mx = 0;\n    (d[c] || []).forEach(function(r){ const id = String(r && r[idf[0]] || '').toUpperCase(); if (id.indexOf(P) === 0){ const n = id.slice(P.length); if (/^\\d+$/.test(n)) mx = Math.max(mx, +n); } });\n    set_('max_' + c, mx); });\n}\n\n/* \u2500\u2500 actions \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\nfunction commit_(p){\n  const ops = p.ops || []; if (!ops.length) return { ver: num_('ver'), idmap: [] };\n  const lock = LockService.getScriptLock(); lock.waitLock(28000);\n  try {\n    const idmap = fixIds_(ops);\n    ops.forEach(function(o){ delete o.n; });\n    const v = num_('ver') + 1; const b = { v: v, t: Date.now(), client: p.client || '', user: p.user || '', ops: ops };\n    appendBatch_(b); SpreadsheetApp.flush(); set_('ver', v); cacheTail_(b);\n    if (v - num_('snap_ver') >= SNAP_EVERY) { try { compact_(); } catch(e) {} }\n    return { ver: v, idmap: idmap };\n  } finally { lock.releaseLock(); }\n}\nfunction load_(){                                   // snapshot + client then polls the newer changes\n  const snap = readSnap_();\n  if (snap.ver !== num_('snap_ver') && num_('snap_ver') > 0) {           // stale Drive copy: still valid, client replays from its own version\n    if (num_('log_start') > snap.ver + 1) return { ver: 0, data: null, retry: true };\n  }\n  return { ver: snap.ver || 0, data: snap.data || {} };\n}\nfunction replace_(p){\n  const lock = LockService.getScriptLock(); lock.waitLock(28000);\n  try {\n    const d = typeof p.data === 'string' ? JSON.parse(p.data) : p.data;\n    const v = num_('ver') + 1;\n    writeSnap_({ ver: v, data: d }); initMaxIds_(d);\n    const sh = sheet_(); if (sh.getLastRow() > 0) sh.deleteRows(1, sh.getLastRow());\n    SpreadsheetApp.flush(); set_('log_start', v + 1); set_('ver', v);\n    try { cache_().remove('tail'); } catch(e) {}\n    return { ver: v };\n  } finally { lock.releaseLock(); }\n}\nfunction diag_(){\n  const sh = sheet_(); const snap = readSnap_();\n  return { server: '3.0', ver: num_('ver'), snapVer: num_('snap_ver'), snapFresh: snap.ver === num_('snap_ver'), logStart: num_('log_start'),\n    logRows: sh.getLastRow(), employees: Object.keys((snap.data || {}).employees || {}).length, sheet: sh.getParent().getUrl() };\n}\nfunction handle_(p){\n  try {\n    if (p.key !== KEY) return out_({ ok: false, error: 'wrong key / \u0645\u0641\u062a\u0627\u062d \u062e\u0627\u0637\u0626' });\n    const a = p.action; let r;\n    if (a === 'info') r = { ver: num_('ver'), online: presence_(null), server: '3.0' };\n    else if (a === 'poll') { r = changes_(Number(p.since || 0)); r.online = presence_(p); }\n    else if (a === 'commit') { r = commit_(p); r.online = presence_(p); }\n    else if (a === 'load') r = load_();\n    else if (a === 'replace') r = replace_(p);\n    else if (a === 'diag') { r = diag_(); r.online = presence_(null); }\n    else return out_({ ok: false, error: 'unknown action' });\n    r.ok = true; return out_(r);\n  } catch (e) { return out_({ ok: false, error: String(e && e.message || e) }); }\n}\n";
const ON_ARRS=['attendance','leaves','payrolls','advances','cl_staff','penalties','evaluations','contract_renewals','change_of_status','activity_log'];
const ON_MAPS=['employees','departments','monthly_snapshots','custom_users','user_permissions','user_passwords','settings'];
const ON_ROOT=['job_titles','disabled_users','insurance_settings','zk_devices','password'];
const ON_LOCAL_SETTINGS=['sync_url','sync_key'];
const ONL={cfg:null,ver:0,shadow:null,busy:false,again:false,timer:null,loop:null,online:[],status:'off',err:'',lastOk:0,client:'',dirtyUI:false,pendingN:0};
function onCfg(){if(!ONL.cfg){let c={};try{c=JSON.parse(ST.get('modo_hr_online')||'{}')||{}}catch(e){}if(!c.url&&DB&&DB.settings.sync_url){c.url=DB.settings.sync_url;c.key=DB.settings.sync_key}ONL.cfg=Object.assign({url:'',key:''},c)}return ONL.cfg}
function onSaveCfg(c){ONL.cfg=c;ST.set('modo_hr_online',JSON.stringify(c))}
const onlineOn=()=>{const c=onCfg();return !!(c.url&&c.key)};
function onClient(){if(!ONL.client){let dev=ST.get('modo_hr_client');if(!dev){dev='c'+Math.random().toString(36).slice(2,10);ST.set('modo_hr_client',dev)}ONL.client=dev+'-'+Math.random().toString(36).slice(2,7)}return ONL.client}/* one id per open tab */
function hstr(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)}return s.length.toString(36)+':'+(h>>>0).toString(36)}
const rkey=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
function ensureKeys(){ON_ARRS.forEach(c=>{(DB[c]||[]).forEach(r=>{if(r&&!r._k)r._k=rkey()})})}
function settingsForSync(){const o={};for(const k in DB.settings)if(!ON_LOCAL_SETTINGS.includes(k))o[k]=DB.settings[k];return o}
function snapHashes(){ensureKeys();const h={};ON_ARRS.forEach(c=>{const m=h[c]={};(DB[c]||[]).forEach(r=>{m[r._k]=hstr(JSON.stringify(r))})});
 ON_MAPS.forEach(c=>{const m=h[c]={};const src=c==='settings'?settingsForSync():(DB[c]||{});for(const k in src)m[k]=hstr(JSON.stringify(src[k]))});
 const r=h._root={};ON_ROOT.forEach(k=>{if(DB[k]!==undefined)r[k]=hstr(JSON.stringify(DB[k]))});return h}
function diffOps(){ensureKeys();const sh=ONL.shadow;const ops=[];
 ON_ARRS.forEach(c=>{const m=sh[c]||(sh[c]={});const seen=new Set();(DB[c]||[]).forEach(r=>{seen.add(r._k);const j=JSON.stringify(r),hh=hstr(j);if(m[r._k]!==hh){const o={c,k:r._k,v:JSON.parse(j),h:hh};if(m[r._k]===undefined)o.n=1;ops.push(o)}});for(const k in m)if(!seen.has(k))ops.push({c,k,v:null})});
 ON_MAPS.forEach(c=>{const m=sh[c]||(sh[c]={});const src=c==='settings'?settingsForSync():(DB[c]||{});for(const k in src){const j=JSON.stringify(src[k]),hh=hstr(j);if(m[k]!==hh)ops.push({c,k,v:JSON.parse(j),h:hh})}for(const k in m)if(!(k in src))ops.push({c,k,v:null})});
 const m=sh._root||(sh._root={});ON_ROOT.forEach(k=>{if(DB[k]===undefined)return;const j=JSON.stringify(DB[k]),hh=hstr(j);if(m[k]!==hh)ops.push({c:'_root',k,v:JSON.parse(j),h:hh})});
 return ops}
function shadowSet(o){const m=ONL.shadow[o.c]||(ONL.shadow[o.c]={});if(o.v===null)delete m[o.k];else m[o.k]=o.h||hstr(JSON.stringify(o.v))}
/* apply only what differs from what this tab already has (works for other users, other tabs, other devices) */
function remoteIsNew(o){const m=(ONL.shadow&&ONL.shadow[o.c])||{};if(o.v===null)return o.k in m;return m[o.k]!==hstr(JSON.stringify(o.v))}
function applyRemoteOp(o){
 if(o.c==='_root'){if(o.v===null)delete DB[o.k];else DB[o.k]=o.v}
 else if(ON_ARRS.includes(o.c)){const a=DB[o.c]||(DB[o.c]=[]);const i=a.findIndex(r=>r&&r._k===o.k);if(o.v===null){if(i>=0)a.splice(i,1)}else if(i>=0)a[i]=o.v;else a.push(o.v)}
 else if(o.c==='settings'){if(ON_LOCAL_SETTINGS.includes(o.k))return;if(o.v===null)delete DB.settings[o.k];else DB.settings[o.k]=o.v}
 else{const m=DB[o.c]||(DB[o.c]={});if(o.v===null)delete m[o.k];else m[o.k]=o.v}
 shadowSet({c:o.c,k:o.k,v:o.v})}
async function onCall(params,timeout){const c=onCfg();const ctl=typeof AbortController!=='undefined'?new AbortController():null;const t=setTimeout(()=>ctl&&ctl.abort(),timeout||60000);
 try{const r=await fetch(c.url,{method:'POST',body:JSON.stringify(Object.assign({key:c.key,client:onClient(),user:S.user||'',page:getHash()},params)),signal:ctl&&ctl.signal});const j=await r.json();if(!j.ok)throw new Error(j.error||'server error');return j}
 catch(e){if(e.name==='AbortError')throw new Error(L('Server timeout','انتهت مهلة الخادم'));if(/fetch|network|load failed/i.test(e.message))throw new Error(L('No internet / server unreachable','لا يوجد إنترنت أو الخادم غير متاح'));throw e}finally{clearTimeout(t)}}
let _shadowT=null;function persistShadow(){clearTimeout(_shadowT);_shadowT=setTimeout(async()=>{const t=JSON.stringify({ver:ONL.ver,client:onClient(),h:ONL.shadow});if(IDB.ok)await IDB.set('modo_hr_shadow',t);else try{ST.set('modo_hr_shadow',t)}catch(e){}},400)}
async function loadShadow(){let t=null;if(IDB.ok)t=await IDB.get('modo_hr_shadow');if(!t)t=ST.get('modo_hr_shadow');try{const o=JSON.parse(t||'null');if(o&&o.h){ONL.shadow=o.h;ONL.ver=o.ver||0;return true}}catch(e){}return false}
function onStatus(st,err){ONL.status=st;ONL.err=err||'';const b=$('#onlb');if(b)b.outerHTML=onlineHTML()}
async function fullLoad(){let r=await onCall({action:'load'},180000);if(r.retry){await new Promise(z=>setTimeout(z,3000));r=await onCall({action:'load'},180000);if(r.retry)throw new Error(L('Server is busy, try again in a minute','الخادم مشغول، حاول بعد دقيقة'))}const lang=DB.language;DB=normalizeDB(r.data||{});DB.language=lang;ensureKeys();ONL.ver=r.ver;ONL.shadow=snapHashes();await persist();persistShadow();setTimeout(()=>onCycle(),60);return r}
async function uploadAll(){ensureKeys();const lang=DB.language;const data=JSON.parse(JSON.stringify(DB));delete data.language;delete data._stamp;if(data.settings){ON_LOCAL_SETTINGS.forEach(k=>delete data.settings[k])}
 const r=await onCall({action:'replace',data:JSON.stringify(data)},300000);ONL.ver=r.ver;ONL.shadow=snapHashes();persistShadow();return r}
async function onCycle(){if(!onlineOn()||!DB)return;if(ONL.busy){ONL.again=true;return}ONL.busy=true;let changed=false;
 try{if(!ONL.shadow){if(!(await loadShadow())){await fullLoad();changed=true}}
  const ops=diffOps();ONL.pendingN=ops.length;
  if(ops.length>4000){onStatus('sync');await uploadAll()}
  else if(ops.length){onStatus('sync');for(let i=0;i<ops.length;i+=1500){const chunk=ops.slice(i,i+1500);const r=await onCall({action:'commit',ops:chunk.map(o=>o.n?{c:o.c,k:o.k,v:o.v,n:1}:{c:o.c,k:o.k,v:o.v})},120000);chunk.forEach(shadowSet);
    (r.idmap||[]).forEach(m=>{const rec=(DB[m.c]||[]).find(x=>x._k===m.k);if(rec){rec[m.field]=m.to;shadowSet({c:m.c,k:m.k,v:rec});changed=true;notify(L(`Number ${m.from} was already used by another user — saved as ${m.to}`,`الرقم ${m.from} استخدمه مستخدم آخر — تم الحفظ برقم ${m.to}`),'info')}});
    if(r.online)ONL.online=r.online}ONL.pendingN=0;persistShadow()}
  const p=await onCall({action:'poll',since:ONL.ver},60000);if(p.online)ONL.online=p.online;
  if(p.reset){await fullLoad();changed=true}
  else{(p.batches||[]).forEach(b=>{b.ops.forEach(o=>{if(remoteIsNew(o)){applyRemoteOp(o);changed=true}})});ONL.ver=p.ver;persistShadow()}
  if(changed)await persist();ONL.lastOk=Date.now();onStatus('ok')}
 catch(e){onStatus('err',e.message);console.warn('online',e)}
 finally{ONL.busy=false;if(changed)onRemoteChanged();if(ONL.again){ONL.again=false;setTimeout(onCycle,50)}}}
function uiBusy(){const a=document.activeElement;const h=getHash();const typing=a&&a.matches&&a.matches('input,textarea,select')&&!(a.closest&&a.closest('.search'));return typing||/\/(new|edit|import|calc|bulk)/.test(h)||/settings\/(password|users\/)/.test(h)}
function onRemoteChanged(){if(!S.user)return;if(!allUsers()[S.user]||DB.disabled_users.includes(S.user)){logout();return}if(uiBusy()){ONL.dirtyUI=true;const b=$('#onlb');if(b)b.outerHTML=onlineHTML();return}ONL.dirtyUI=false;const y=window.scrollY;const a=document.activeElement;const st=a&&a.dataset&&a.dataset.t?{t:a.dataset.t,p:a.selectionStart}:null;render();window.scrollTo(0,y);if(st){const n=document.querySelector(`.search input[data-t="${st.t}"]`);if(n){n.focus();try{n.setSelectionRange(st.p,st.p)}catch(e){}}}}
document.addEventListener('focusout',()=>setTimeout(()=>{if(ONL.dirtyUI&&!uiBusy())onRemoteChanged()},300));
function onlineHTML(){if(!onlineOn())return `<span id="onlb" style="display:block;margin-top:6px;padding:6px 8px;border-radius:8px;background:#7F1D1D;color:#FECACA;font-size:11.5px;cursor:pointer" onclick="${isAdmin()?"go('settings/sync')":'logout()'}">⚠ ${L('This device is NOT linked to the online server — data here is local only','هذا الجهاز غير مربوط بالخادم الأون لاين — البيانات هنا على الجهاز فقط')}</span>`;const n=ONL.online.length;const names=ONL.online.map(o=>o.user).filter((v,i,a)=>a.indexOf(v)===i);
 const dot=ONL.status==='err'?'#EF4444':ONL.status==='sync'?'#F59E0B':'#10B981';
 return `<span id="onlb" style="display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11.5px;color:#CBD5E1;cursor:pointer;flex-wrap:wrap" onclick="onCycle().then(()=>notify(L('Synced','تمت المزامنة')+' · v'+ONL.ver,'info'))" title="${esc(names.join(', '))} · v${ONL.ver}"><i style="width:8px;height:8px;border-radius:50%;background:${dot};display:inline-block;box-shadow:0 0 8px ${dot}"></i>${ONL.status==='err'?L('Offline — will retry','غير متصل — ستتم إعادة المحاولة'):`${L('Online','أون لاين')} · ${n} ${L('connected','متصل')}`}${ONL.dirtyUI?` <a style="color:#FCD34D" onclick="event.stopPropagation();ONL.dirtyUI=false;render()">↻ ${L('new updates','تحديثات جديدة')}</a>`:''}</span>`}
const _saveLocalOnline=saveDB;
saveDB=function(){const ok=_saveLocalOnline();if(onlineOn()){clearTimeout(ONL.timer);ONL.timer=setTimeout(onCycle,700)}return ok};
function onlineStart(){if(ONL.loop)clearInterval(ONL.loop);let tick=0;ONL.loop=setInterval(()=>{tick++;if(!onlineOn())return;const vis=document.visibilityState==='visible';if(vis||tick%5===0)onCycle()},3000);if(onlineOn())onCycle()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&onlineOn())onCycle()});
window.addEventListener('focus',()=>{if(onlineOn())onCycle()});

/* Settings → Online */
function setSync(){const c=onCfg();const on=onlineOn();const st=!on?badge(L('Off','غير مفعّل'),'mut'):ONL.status==='err'?badge(L('Not connected','غير متصل'),'bad'):badge(L('Connected','متصل'),'ok');
 return `<form id="frm" onsubmit="return false"><div class="card"><h3>🌐 ${L('Online — all users at the same time','تشغيل أون لاين — كل المستخدمين في نفس الوقت')} ${st}</h3>
 <p class="muted">${L('Every user (hotel PCs, phones, home) works on the same live data at the same time. Each change is sent alone and appears on all other screens within seconds — no overwriting each other. Data is stored in your own Google Drive, free.','كل المستخدمين (أجهزة الفندق والموبايلات ومن البيت) يعملون على نفس البيانات الحية في نفس الوقت. كل تعديل يُرسل وحده ويظهر عند الباقين خلال ثوانٍ — بدون أن يمسح أحد شغل الآخر. البيانات محفوظة في Google Drive الخاص بك مجاناً.')}</p>
 <div class="grid">${fld(L('Server URL (Web App)','رابط الخادم (Web App URL)'),`<input type="text" name="url" dir="ltr" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(c.url)}">`,1)}${fld(L('Key (same as KEY in the server code)','المفتاح (نفس KEY في كود الخادم)'),`<input type="text" name="key" dir="ltr" value="${esc(c.key)}">`)}</div>
 ${ONL.err&&on?`<div class="warn mt">⚠ ${esc(ONL.err)}</div>`:''}
 <div class="actions">${btn('🔗 '+L('Save & Connect','حفظ واتصال'),'onConnect()','g')}${on?btn('🔗 '+L('Device setup link','رابط ربط الأجهزة'),'onSetupLink()','v')+btn('🩺 '+L('Check server','فحص الخادم'),'onDiag()','d')+btn('⬇️ '+L('Reload everything from server','تحميل كل البيانات من الخادم'),'onForceLoad()','b')+dbtn('⬆️ '+L('Upload this device data (replace server)','رفع بيانات هذا الجهاز (استبدال الخادم)'),'onForceUpload()','y')+dbtn('⛔ '+L('Disconnect this device','فصل هذا الجهاز'),'onDisconnect()','r'):''}</div></div>
 <div id="onlExtra"></div>
 ${on?`<div class="card"><h3>🟢 ${L('Connected now','المتصلون الآن')} (${ONL.online.length})</h3>${table([L('User','المستخدم'),L('Page','الصفحة'),L('Last seen','آخر ظهور')],ONL.online.map(o=>({c:[esc(o.user)+(o.client===onClient()?` <span class="pill">${L('this device','هذا الجهاز')}</span>`:''),esc((o.page||'').replace('#/','')),o.ago+' '+L('sec','ث')]})),{id:'tonl'})}
 <p class="muted mt">${L('Version','الإصدار')}: ${ONL.ver} — ${L('Last contact','آخر اتصال')}: ${ONL.lastOk?new Date(ONL.lastOk).toLocaleTimeString():'—'}${ONL.pendingN?` — ${L('pending changes','تعديلات في الانتظار')}: ${ONL.pendingN}`:''}</p></div>`:''}
 <div class="card"><h3>🛠️ ${L('One-time setup (about 5 minutes)','الإعداد لمرة واحدة (حوالي 5 دقائق)')}</h3><ol style="line-height:2.1">
 <li>${L('Open','افتح')} <b dir="ltr">script.google.com</b> ${L('with the hotel Google account → New project.','بحساب جوجل الخاص بالفندق ← New project.')}</li>
 <li>${L('Delete the default code and paste the server code below. Change','احذف الكود الموجود والصق كود الخادم بالأسفل، وغيّر')} <code dir="ltr">KEY = 'CHANGE-ME'</code> ${L('to a secret word.','إلى كلمة سرية.')}</li>
 <li>${L('Deploy → New deployment → ⚙️ Web app → Execute as: Me — Who has access: Anyone → Deploy → Authorize access.','Deploy ← New deployment ← ⚙️ Web app ← Execute as: Me و Who has access: Anyone ← Deploy ← وافق على الصلاحيات (Authorize).')}</li>
 <li>${L('Copy the Web App URL, paste it above with the same key and press "Save & Connect". The first device uploads its data automatically.','انسخ رابط Web App والصقه بالأعلى مع نفس المفتاح واضغط "حفظ واتصال". أول جهاز يرفع بياناته تلقائياً.')}</li>
 <li>${L('On every other PC / phone: open the program, sign in, and enter the same URL and key once.','على كل كمبيوتر أو موبايل آخر: افتح البرنامج وسجّل الدخول وأدخل نفس الرابط والمفتاح مرة واحدة.')}</li>
 <li>${L('Put the program file online (e.g. GitHub Pages) so everyone opens the same link.','ارفع ملف البرنامج أون لاين (مثل GitHub Pages) ليفتح الجميع نفس الرابط.')}</li></ol>
 <textarea id="gas" readonly dir="ltr" style="min-height:240px;font-family:monospace;font-size:12px">${esc(SERVER_GS)}</textarea>
 <div class="mt">${btn('📋 '+L('Copy server code','نسخ كود الخادم'),"onCopyGas()",'d')} ${btn('⬇️ MODO_HR_Server.gs',"dlBlob('MODO_HR_Server.gs',SERVER_GS,'text/plain')",'b')}</div></div></form>`}
function onCopyGas(){const t=$('#gas');try{navigator.clipboard.writeText(t.value).then(()=>notify(L('Copied','تم النسخ')),()=>{t.select();document.execCommand('copy');notify(L('Copied','تم النسخ'))})}catch(e){t.select();document.execCommand('copy');notify(L('Copied','تم النسخ'))}}
async function onConnect(){const f=F();const c={url:fv(f,'url').trim(),key:fv(f,'key').trim()};if(!c.url||!c.key){notify(L('Enter the URL and key','أدخل الرابط والمفتاح'),'err');return}
 if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(c.url)&&!/^https?:\/\//.test(c.url)){notify(L('Invalid URL','رابط غير صحيح'),'err');return}
 onSaveCfg(c);notify('⏳ '+L('Connecting…','جاري الاتصال…'),'info');
 try{const info=await onCall({action:'info'},60000);
  if(!info.ver){await uploadAll();notify(L('Connected — this device data was uploaded. Other users can connect now.','تم الاتصال — تم رفع بيانات هذا الجهاز. يمكن لباقي المستخدمين الاتصال الآن.'))}
  else{await fullLoad();notify(L('Connected — live data loaded from the server.','تم الاتصال — تم تحميل البيانات الحية من الخادم.'))}
  log('Online connect',c.url.slice(0,60),'settings');saveDB();onStatus('ok');onlineStart();render()}
 catch(e){onStatus('err',e.message);notify(L('Connection failed: ','فشل الاتصال: ')+e.message,'err');render()}}
async function onForceLoad(){try{notify('⏳','info');await fullLoad();notify(L('Reloaded from server','تم التحميل من الخادم'));render()}catch(e){notify(e.message,'err')}}
async function onForceUpload(){try{notify('⏳','info');await uploadAll();notify(L('This device data is now on the server; all users will reload it.','بيانات هذا الجهاز أصبحت على الخادم وسيتم تحميلها عند كل المستخدمين.'));render()}catch(e){notify(e.message,'err')}}
function onDisconnect(){onSaveCfg({url:'',key:''});ONL.shadow=null;ONL.ver=0;ONL.online=[];if(IDB.ok)IDB.set('modo_hr_shadow','');ST.del('modo_hr_shadow');if(DB.settings.sync_url){DB.settings.sync_url='';DB.settings.sync_key=''}onStatus('off');persist();render()}

/* one-click device setup: send this link (WhatsApp etc.) — opening it links the device automatically */

 $('#onlExtra').innerHTML=`<div class="card"><h3>🔗 ${L('Device setup link','رابط ربط الأجهزة')}</h3><p class="muted">${L('Send this link privately to each user (it contains the server key). Opening it links that device to the server automatically — then they sign in normally.','ابعت الرابط ده لكل مستخدم في رسالة خاصة (فيه مفتاح الخادم). أول ما يفتحه الجهاز يتربط بالخادم تلقائياً — وبعدها يسجل دخول عادي.')}</p><textarea readonly dir="ltr" style="min-height:70px;font-family:monospace;font-size:12px" onclick="this.select()">${esc(link)}</textarea><div class="mt">${btn('📋 '+L('Copy link','نسخ الرابط'),"navigator.clipboard&&navigator.clipboard.writeText(document.querySelector('#onlExtra textarea').value).then(()=>notify(L('Copied','تم النسخ')))",'d')} ${btn('💬 WhatsApp',"window.open('https://wa.me/?text='+encodeURIComponent(document.querySelector('#onlExtra textarea').value),'_blank')",'g')}</div></div>`}
async function onDiag(){const box=$('#onlExtra');box.innerHTML=`<div class="flash info">⏳ ${L('Checking the server…','جاري فحص الخادم…')}</div>`;
 try{await onCycle();const t0=Date.now();const d=await onCall({action:'diag'},90000);const ms=Date.now()-t0;const okv=d.ver===ONL.ver;const v3=String(d.server||'').startsWith('3');
  box.innerHTML=`<div class="card"><h3>🩺 ${L('Server check','فحص الخادم')}</h3><div class="kv">
  <b>${L('Server version','إصدار الخادم')}</b><span>${esc(d.server||'2')} ${v3?'✅':'⚠️ '+L('old — paste the new server code and Deploy → New version','قديم — الصق كود الخادم الجديد واعمل Deploy ← New version')}</span>
  <b>${L('Data version (server / this device)','رقم البيانات (الخادم / هذا الجهاز)')}</b><span>${d.ver} / ${ONL.ver} ${okv?'✅ '+L('up to date','محدّث'):'⏳'}</span>
  ${v3?`<b>${L('Change log rows','سطور سجل التعديلات')}</b><span>${d.logRows} (${L('snapshot','اللقطة')} v${d.snapVer})</span><b>${L('Change log sheet','شيت سجل التعديلات')}</b><span><a href="${esc(d.sheet||'#')}" target="_blank">${L('open','فتح')}</a></span>`:''}
  <b>${L('Connected users','المستخدمون المتصلون')}</b><span>${esc((d.online||[]).map(o=>o.user+(o.client===onClient()?' ('+L('this device','هذا الجهاز')+')':'')).join(' — ')||'—')}</span>
  <b>${L('Response time','زمن الاستجابة')}</b><span>${ms} ms</span></div></div>`}
 catch(e){box.innerHTML=`<div class="flash err">❌ ${esc(e.message)}</div>`}}
async function onHashConnect(){const h=(()=>{try{return location.hash}catch(e){return ''}})();if(!h.startsWith('#connect='))return false;
 try{const o=JSON.parse(decodeURIComponent(escape(atob(h.slice(9)))));try{history.replaceState(null,'',location.pathname+location.search)}catch(e){location.hash=''}
  if(!o.u||!o.k)return false;onSaveCfg({url:o.u,key:o.k});ONL.shadow=null;S.tmp.connectMsg='⏳ '+L('Linking this device to the server…','جاري ربط الجهاز بالخادم…');render();
  await fullLoad();S.tmp.connectMsg='✅ '+L('This device is now linked to the online server. Sign in.','تم ربط هذا الجهاز بالخادم الأون لاين. سجّل الدخول.');onlineStart();render();return true}
 catch(e){S.tmp.connectMsg='❌ '+e.message;render();return false}}

function autoArchive(){if(!Object.keys(DB.employees).length)return;const t=today();let m=t.getMonth()+1,y=t.getFullYear();if(t.getDate()<25){m--;if(m<1){m=12;y--}}if(archiveSnapshot(m,y,false)){log('Auto archive',`${pad(m)}-${y}`,'payroll');saveDB()}}
async function boot(){await loadDB();try{const s=JSON.parse(SS.get(SESS)||'null');if(s&&allUsers()[s.u]&&!DB.disabled_users.includes(s.u)){S.user=s.u;S.role=allUsers()[s.u].role}}catch(e){}
 autoArchive();render();
 onlineStart();onHashConnect();
 window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.tmp.installEvt=e});
 try{const man={name:'MODO HR ERP',short_name:'MODO HR',start_url:location.href.split('#')[0],display:'standalone',background_color:'#0F172A',theme_color:'#1E3A5F',dir:'rtl',lang:'ar',icons:[{src:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06B6D4"/><stop offset="1" stop-color="#6366F1"/></linearGradient></defs><rect width="192" height="192" rx="40" fill="url(#g)"/><text x="96" y="118" font-family="Arial" font-weight="700" font-size="72" fill="#fff" text-anchor="middle">HR</text></svg>'),sizes:'192x192',type:'image/svg+xml'}]};
  const l=document.createElement('link');l.rel='manifest';l.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(man));document.head.appendChild(l);
  const ic=document.createElement('link');ic.rel='icon';ic.href=man.icons[0].src;document.head.appendChild(ic)}catch(e){}}
boot();
